name: DevopsChange

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
      - name: Run a one-line script
        run: echo Hello, world!
  uat-deploy:
    name: UAT-Deploy        
    runs-on: ubuntu-latest 
    needs: build
    #if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: ServiceNow Change
        uses: ServiceNow/servicenow-devops-change@v7.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'UAT-Deploy'
          change-request: '{"setCloseCode":"true","autoCloseChange":true,"attributes":{"short_description":"Automated Software Deployment","description":"Automated Software Deployment.","assignment_group":"a715cd759f2002002920bde8132e7018","implementation_plan":"Software update is tested and results can be found in Test Summaries Tab; When the change is approved the implementation happens automated by the CICD pipeline within the change planned start and end time window.","backout_plan":"When software fails in production, the previous software release will be re-deployed.","test_plan":"Testing if the software was successfully deployed"}}'          
          #change-request: '{"setCloseCode":"true","attributes":{"chg_model_template":"941425d393120350fcf2f1ccebba1019","short_description":"test if takes precedence over template"}}'          
          #passed attributes take precedence over templates
          interval: '100'
          timeout: '3600'
  uat-test:
    name: UAT-Test
    runs-on: ubuntu-latest
    needs: uat-deploy
    steps:
      - uses: actions/checkout@v6
      - name: Run a one-line script
        run: echo Hello, world!
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.         
  prod-deploy:
    name: PROD-Deploy
    runs-on: ubuntu-latest
    needs: uat-test
    steps:
      - name: ServiceNow Change
        uses: ServiceNow/servicenow-devops-change@v7.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'PROD-Deploy'
          change-request: '{"setCloseCode":true,"autoCloseChange":true,"attributes":{"chg_model":{"name":"DevOps"},"short_description":"Automated Software Deployment","description":"n/a","requested_by":{"name": "DevOps System"},"implementation_plan":"Implementation happens automated by the CICD pipeline within the change planned start and end time window.","backout_plan":"Feature Flag backout","test_plan":"n/a"}}'          
          #change-request: '{"setCloseCode":true,"attributes":{"short_description":"Automated PROD Software Deployment","description":"Automated Software Deployment.","assignment_group":"a715cd759f2002002920bde8132e7018","implementation_plan":"Software update is tested and results can be found in Test Summaries Tab; When the change is approved the implementation happens automated by the CICD pipeline within the change planned start and end time window.","backout_plan":"When software fails in production, the previous software release will be re-deployed.","test_plan":"Testing if the software was successfully deployed"}}'          
          #change-request: '{"setCloseCode":true,"attributes":{"chg_model":"5c05c754433a02104a6e556d58b8f278","short_description":"Automated PROD Software Deployment","description":"Automated Software Deployment.","assignment_group":"a715cd759f2002002920bde8132e7018","backout_plan":"LaunchDarkly flag","devops_change":"true","implementation_plan":"Software update is tested and results can be found in Test Summaries Tab; When the change is approved the implementation happens automated by the CICD pipeline within the change planned start and end time window.","test_plan":"Testing if the software was successfully deployed"}}'          
          #5c05c754433a02104a6e556d58b8f278 is DevOps Simple
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: false
          #job aborts after 1 hour if not approved by default
      - uses: actions/checkout@v6
      - name: Run a one-line script
        run: echo Hello, world!
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
