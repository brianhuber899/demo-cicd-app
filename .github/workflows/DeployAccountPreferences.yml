# This is a basic workflow to help you get started with Actions

name: Deploy Accounts Preferences

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
   
  # deploy stage
  deploy:
    name: Deploy to INT, CERT and PROD
    uses: brianhuber899/demo-cicd-app/.github/workflows/devopschange.yml@main
    secrets:
      SN_DEVOPS_INTEGRATION_TOKEN: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
      SN_INSTANCE_URL: ${{ secrets.SN_INSTANCE_URL }}
      SN_ORCHESTRATION_TOOL_ID: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
